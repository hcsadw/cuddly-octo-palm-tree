<!DOCTYPE html>
<html>
<head>
  <title>404 Not Found</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline loop></video>

  <script>
    const videos = ["a.mp4", "b.mp4", "c.mp4"];
    const random = videos[Math.floor(Math.random() * videos.length)];
    document.getElementById("video").src = random;
  </script>

</body>
</html>
